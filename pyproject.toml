[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinless"
version = "0.1.0"
description = "Turn your Strava export (or any GPX/FIT/TCX) into a print-ready poster of the city you run, with privacy built in. Runs locally."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lostmanu" }]
keywords = ["strava", "gpx", "running", "poster", "map", "openstreetmap", "heatmap"]
dependencies = [
  "osmnx>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "matplotlib>=3.8",
  "contourpy>=1.2",
  "numpy>=1.26",
  "pillow>=10",
  "fitdecode>=0.10",
  "tzfpy>=2.1",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pinless = "pinless.cli:main"

[tool.setuptools]
packages = ["pinless"]

[tool.setuptools.package-data]
pinless = ["fonts/*.ttf", "fonts/*.txt"]
